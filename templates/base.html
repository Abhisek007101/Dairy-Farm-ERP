<!DOCTYPE html>
<html>
<head>
    <title>Dairy ERP</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            height: 100vh;
            position: fixed;
            background: #1e293b;
            color: white;
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #334155;
        }

        /* MAIN CONTENT */
        .main {
            margin-left: 220px;
            padding: 20px;
        }

        .brand {
            font-size: 18px;
            font-weight: bold;
            padding: 10px 20px;
            margin-bottom: 10px;
        }
    </style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <div class="brand">🐄 Dairy ERP</div>

    <a href="/dashboard/">📊 Dashboard</a>
    <a href="/animals/">🐄 Animals</a>
    <a href="/milk/">🥛 Milk Records</a>
    <a href="/sales/">💰 Sales</a>
    <a href="/expense/">💸 Expenses</a>
    <a href="{% url 'logout' %}">🚪 Logout</a>
</div>

<!-- MAIN CONTENT -->
<div class="main">

    {% block content %}
    {% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
