<!DOCTYPE html>
<html>
<head>
    <title>Dairy ERP Login</title>

    {% load static %}

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(135deg,#0f172a,#1e293b);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            width:400px;
            background:white;
            border-radius:15px;
            padding:30px;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }

        .logo{
            text-align:center;
            font-size:32px;
            margin-bottom:10px;
        }

        .title{
            text-align:center;
            font-weight:bold;
            margin-bottom:20px;
        }

        .btn-login{
            width:100%;
        }
    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        🐄
    </div>

    <h3 class="title">Dairy Farm ERP</h3>

    <form method="post">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input
                type="text"
                name="username"
                class="form-control"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input
                type="password"
                name="password"
                class="form-control"
                required
            >
        </div>

        {% if form.errors %}
            <div class="alert alert-danger">
                Invalid username or password
            </div>
        {% endif %}

        <button type="submit" class="btn btn-primary btn-login">
            Login
        </button>

    </form>

</div>

</body>
</html>
